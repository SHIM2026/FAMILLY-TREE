const BW=166, BH=46;
const by=Object.fromEntries(N.map(n=>[n.id,n]));
const world=document.getElementById('world'), svg=document.getElementById('svg'), view=document.getElementById('view');
const maxX=Math.max(...N.map(n=>n.x))+BW+180, maxY=Math.max(...N.map(n=>n.y))+BH+150;
world.style.width=maxX+'px'; world.style.height=maxY+'px';
svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);

function line(x1,y1,x2,y2){
 const e=document.createElementNS('http://www.w3.org/2000/svg','line');
 e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);e.setAttribute('class','line');svg.appendChild(e);
}
const ch={};
R.forEach(([p,c])=>{(ch[p]??=[]).push(c)});
Object.entries(ch).forEach(([pid,kids])=>{
 const p=by[pid]; if(!p) return;
 const cs=kids.map(id=>by[id]).filter(Boolean).sort((a,b)=>a.x-b.x);
 if(!cs.length)return;
 const px=p.x+BW/2, py=p.y+BH;
 const cy=Math.min(...cs.map(c=>c.y));
 const mid=py+(cy-py)*0.48;
 function tline(x1,y1,x2,y2, childIds){
   const e=document.createElementNS('http://www.w3.org/2000/svg','line');
   e.setAttribute('x1',x1);e.setAttribute('y1',y1);e.setAttribute('x2',x2);e.setAttribute('y2',y2);
   e.setAttribute('class','line'); e.dataset.parent=pid; e.dataset.children=childIds.join(',');
   svg.appendChild(e);
 }
 tline(px,py,px,mid,cs.map(c=>c.id));
 if(cs.length>1){
   const lx=cs[0].x+BW/2, rx=cs[cs.length-1].x+BW/2;
   tline(lx,mid,rx,mid,cs.map(c=>c.id));
 }
 cs.forEach(c=>{
   const cx=c.x+BW/2;
   tline(cx,mid,cx,c.y,[c.id]);
 });
});

G.forEach(([g,r])=>{
 const d=document.createElement('div');d.className='gen';d.textContent=g+'대';
 d.style.top=(90+((r-3)/2)*(70*2)+12)+'px';world.appendChild(d);
});

N.forEach(n=>{
 const d=document.createElement('div');d.className='box '+(n.name.includes('(女)')?'f':'');
 d.dataset.id=n.id;d.textContent=n.name;d.style.left=n.x+'px';d.style.top=n.y+'px';
 d.addEventListener('click',()=>traceByTouch(n.id));
 world.appendChild(d);
});

let scale=1;
function applyScale(){world.style.transform='scale('+scale+')';world.style.width=(maxX*scale)+'px';world.style.height=(maxY*scale)+'px';}
function zoomBy(f){scale=Math.max(.12,Math.min(2.5,scale*f));applyScale();}
function fitAll(){scale=Math.min((view.clientWidth-10)/maxX,(view.clientHeight-10)/maxY);scale=Math.max(.12,scale);applyScale();view.scrollTo(0,0);}
function findName(){
 document.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
 const q=document.getElementById('q').value.trim();if(!q)return;
 const n=N.find(x=>x.name.includes(q));if(!n)return alert('찾는 이름이 없습니다.');
 const el=document.querySelector('[data-id="'+n.id+'"]');el.classList.add('hit');
 const x=n.x*scale-view.clientWidth/2, y=n.y*scale-view.clientHeight/2;
 view.scrollTo({left:Math.max(0,x),top:Math.max(0,y),behavior:'smooth'});
}

const parents={};
R.forEach(([p,c])=>{(parents[c]??=[]).push(p)});

function selectedNode(){
 const q=document.getElementById('q').value.trim();
 if(!q){alert('추적할 이름을 입력해 주세요.');return null;}
 const matches=N.filter(x=>x.name.includes(q));
 if(!matches.length){alert('찾는 이름이 없습니다.');return null;}
 if(matches.length>1){
   // 같은 이름이 여러 명이면 현재 화면에서 가장 가까운 인물을 우선 선택
   const cx=(view.scrollLeft+view.clientWidth/2)/scale, cy=(view.scrollTop+view.clientHeight/2)/scale;
   matches.sort((a,b)=>Math.hypot(a.x-cx,a.y-cy)-Math.hypot(b.x-cx,b.y-cy));
 }
 return matches[0];
}
function collectUp(id,set=new Set()){
 if(set.has(id))return set; set.add(id);
 (parents[id]||[]).forEach(p=>collectUp(p,set)); return set;
}
function collectDown(id,set=new Set()){
 if(set.has(id))return set; set.add(id);
 (ch[id]||[]).forEach(c=>collectDown(c,set)); return set;
}
function showTrace(ids){
 document.querySelectorAll('.box').forEach(e=>{
   const on=ids.has(e.dataset.id); e.classList.toggle('trace',on);e.classList.toggle('dim',!on);
 });
 document.querySelectorAll('svg .line').forEach(e=>{
   const p=e.dataset.parent, cs=(e.dataset.children||'').split(',').filter(Boolean);
   const on=p && ids.has(p) && cs.some(c=>ids.has(c));
   e.classList.toggle('traceLine',on);e.classList.toggle('dim',!on);
 });
}
function focusNode(n){
 const el=document.querySelector('[data-id="'+n.id+'"]');
 if(el)el.classList.add('hit');
 view.scrollTo({left:Math.max(0,n.x*scale-view.clientWidth/2),top:Math.max(0,n.y*scale-view.clientHeight/2),behavior:'smooth'});
}

function traceByTouch(id){
 document.querySelectorAll('.traceOverlay').forEach(e=>e.remove());
 // 이전 선택자의 노란색 표시까지 모두 해제한 뒤 새 계보만 표시
 clearTrace(true);
 const ids=collectUp(id);
 // 모든 인물은 원래 상태로 유지하고 선택한 계보의 박스만 테두리 강조
 document.querySelectorAll('.box').forEach(e=>{
   e.classList.remove('dim','trace');
   if(ids.has(e.dataset.id)) e.classList.add('trace');
 });
 // 선택된 사람에서 위 조상으로 이어지는 연결선만 빨간색으로 표시
 document.querySelectorAll('svg .line').forEach(e=>{
   e.classList.remove('dim','traceLine');
   const p=e.dataset.parent;
   const cs=(e.dataset.children||'').split(',').filter(Boolean);
   if(!p || !ids.has(p)) return;

   // 직계 계보에 필요한 세로선과 수평선 모두 빨간색으로 표시.
   // 단, 수평선 전체를 칠하지 않고 부모 중심에서 선택된 직계 자녀의
   // 분기점까지만 별도의 빨간 선을 덧그린다.
   if(cs.length===1 && ids.has(cs[0])) e.classList.add('traceLine');

   if(cs.length>1){
     const x1=Number(e.getAttribute('x1')), x2=Number(e.getAttribute('x2'));
     const y1=Number(e.getAttribute('y1')), y2=Number(e.getAttribute('y2'));
     if(Math.abs(x1-x2)<0.1 && cs.some(c=>ids.has(c))) {
       e.classList.add('traceLine');
     }
     if(Math.abs(y1-y2)<0.1){
       const target=cs.find(c=>ids.has(c));
       if(target && by[target]){
         const pnode=by[p], cnode=by[target];
         const px=pnode.x+BW/2, cx=cnode.x+BW/2;
         const red=document.createElementNS('http://www.w3.org/2000/svg','line');
         red.setAttribute('x1',px); red.setAttribute('y1',y1);
         red.setAttribute('x2',cx); red.setAttribute('y2',y1);
         red.setAttribute('class','line traceLine traceOverlay');
         svg.appendChild(red);
       }
     }
   }
 });
 // 선택한 본인 박스 강조
 const el=document.querySelector('[data-id="'+id+'"]');
 if(el) el.classList.add('hit');
}

function traceAncestors(){clearTrace(false);const n=selectedNode();if(!n)return;showTrace(collectUp(n.id));focusNode(n);}
function traceDescendants(){clearTrace(false);const n=selectedNode();if(!n)return;showTrace(collectDown(n.id));focusNode(n);}
function clearTrace(clearHit=true){
 document.querySelectorAll('.traceOverlay').forEach(e=>e.remove());
 document.querySelectorAll('.box').forEach(e=>e.classList.remove('trace','dim'));
 document.querySelectorAll('svg .line').forEach(e=>e.classList.remove('traceLine','dim'));
 if(clearHit)document.querySelectorAll('.hit').forEach(e=>e.classList.remove('hit'));
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')findName()});
setTimeout(()=>{scale=.55;applyScale(); const target=by['K45']||N[0]; view.scrollTo(target.x*scale-80,target.y*scale-100);},50);
</script>
