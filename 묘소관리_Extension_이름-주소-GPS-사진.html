<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f2">
<title>묘소 관리 Extension</title>
<style>
:root{--bg:#f5f5ef;--card:#fff;--text:#222;--muted:#707070;--line:#ddd;--accent:#365f42;--danger:#9b3030}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:14px 16px}header h1{margin:0;font-size:21px}header small{color:var(--muted)}
main{max-width:720px;margin:auto;padding:14px 12px 80px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}h2{font-size:18px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}label{display:block;font-weight:700;font-size:14px;margin-bottom:6px}input,textarea{width:100%;font-size:16px;padding:12px;border:1px solid #bbb;border-radius:10px;background:#fff}textarea{min-height:88px;resize:vertical}button,.btn{border:0;border-radius:10px;padding:12px 14px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#e9eee9;color:#263b2b}.danger{background:#f5e7e7;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1;min-width:130px}.status{font-size:14px;color:var(--muted);margin-top:7px}.photoGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photoBox{border:1px solid var(--line);border-radius:12px;padding:10px}.photoBox img{display:none;width:100%;height:150px;object-fit:cover;border-radius:8px;margin-top:8px;background:#eee}.record{border-top:1px solid var(--line);padding:13px 0}.record:first-child{border-top:0;padding-top:0}.record-title{font-weight:800;font-size:17px}.meta{font-size:14px;color:#555;line-height:1.55;white-space:pre-wrap}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}.gallery figure{margin:0}.gallery img{width:100%;height:150px;object-fit:cover;border-radius:9px}.gallery figcaption{font-size:12px;color:#555;margin-top:3px}.empty{text-align:center;color:var(--muted);padding:20px 0}.badge{display:inline-block;font-size:12px;background:#edf1ed;padding:4px 7px;border-radius:20px;margin-left:5px}@media(max-width:520px){.row,.photoGrid{grid-template-columns:1fr}.gallery img{height:130px}}
</style></head><body>
<header><h1>묘소 관리 Extension</h1><small>여러 사진 · GPS · 주소 · 메모를 묘소별로 저장</small></header>
<main>
<section class="card"><h2 id="formTitle">새 묘소 기록</h2><input type="hidden" id="editId">
<div class="field"><label>① 성명 / 묘소 이름</label><input id="name" placeholder="예: 심○○ 묘소"></div>
<div class="field"><label>② 주소</label><input id="address" placeholder="주소 직접 입력 가능 / GPS 사용 시 자동 확인"></div>
<div class="field"><label>③ GPS 현재 위치</label><div class="actions"><button class="secondary" id="gpsBtn" type="button">📍 현재 위치 가져오기</button><button class="secondary" id="mapBtn" type="button">🗺️ 지도에서 보기</button></div><div class="row" style="margin-top:8px"><input id="lat" inputmode="decimal" placeholder="위도"><input id="lng" inputmode="decimal" placeholder="경도"></div><div class="status" id="gpsStatus">위치 버튼을 누르면 GPS 좌표와 주소를 확인합니다.</div></div>
<div class="field"><label>④ 묘소 사진</label><div class="photoGrid">
<div class="photoBox"><b>① 묘소 전체 앞면</b><input id="pOverall" type="file" accept="image/*" capture="environment"><img id="vOverall"></div>
<div class="photoBox"><b>② 묘비 앞면</b><input id="pFront" type="file" accept="image/*" capture="environment"><img id="vFront"></div>
<div class="photoBox"><b>③ 묘비 뒷면</b><input id="pBack" type="file" accept="image/*" capture="environment"><img id="vBack"></div>
<div class="photoBox"><b>④ 주변·진입로</b><input id="pAccess" type="file" accept="image/*" capture="environment"><img id="vAccess"></div>
<div class="photoBox"><b>⑤ 추가 사진</b><input id="pExtra" type="file" accept="image/*" capture="environment" multiple><div id="extraPreview" class="gallery"></div></div>
</div><div class="status">사진은 묘소 기록과 함께 저장됩니다. 추가 사진은 여러 장 선택할 수 있습니다.</div></div>
<div class="field"><label>관계 / 비고</label><input id="relation" placeholder="예: 증조부"></div>
<div class="field"><label>메모</label><textarea id="memo" placeholder="묘비 내용, 찾아가는 길, 관리 사항 등을 기록하세요."></textarea></div>
<div class="actions"><button class="primary" id="saveBtn" type="button">💾 묘소 기록 저장</button><button class="secondary" id="cancelBtn" type="button" style="display:none">수정 취소</button></div></section>
<section class="card"><h2>저장된 묘소 <span class="badge" id="count">0</span></h2><div class="actions" style="margin-bottom:8px"><button class="secondary" id="csvBtn" type="button">엑셀용 CSV 저장</button><button class="secondary" id="exportBtn" type="button">전체 백업 저장</button><label class="btn secondary" style="text-align:center">백업 불러오기<input id="importFile" type="file" accept="application/json" style="display:none"></label></div><div id="records"><div class="empty">아직 저장된 기록이 없습니다.</div></div></section>
</main><script>
const $=id=>document.getElementById(id),DB="graveManagerExtensionV1";let photos={overall:"",front:"",back:"",access:"",extra:[]};
function getRecords(){try{return JSON.parse(localStorage.getItem(DB)||"[]")}catch(e){return[]}}function setRecords(v){localStorage.setItem(DB,JSON.stringify(v))}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function compress(file){return new Promise((resolve,reject)=>{const rd=new FileReader(),im=new Image();rd.onload=e=>im.src=e.target.result;rd.onerror=reject;im.onload=()=>{const max=1100,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext("2d").drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",.7))};rd.readAsDataURL(file)})}
function show(id,data){const e=$(id);e.src=data||"";e.style.display=data?"block":"none"}function showExtra(){$("extraPreview").innerHTML=photos.extra.map((x,i)=>`<figure><img src="${x}"><figcaption>추가 ${i+1}</figcaption></figure>`).join("")}
async function bindPhoto(input,key,view){$(input).onchange=async e=>{const f=e.target.files[0];if(!f)return;photos[key]=await compress(f);show(view,photos[key])}}bindPhoto("pOverall","overall","vOverall");bindPhoto("pFront","front","vFront");bindPhoto("pBack","back","vBack");bindPhoto("pAccess","access","vAccess");$("pExtra").onchange=async e=>{photos.extra=[];for(const f of [...e.target.files])photos.extra.push(await compress(f));showExtra()};
function reset(){["editId","name","relation","lat","lng","address","memo","pOverall","pFront","pBack","pAccess","pExtra"].forEach(x=>$(x).value="");photos={overall:"",front:"",back:"",access:"",extra:[]};["vOverall","vFront","vBack","vAccess"].forEach(x=>show(x,""));showExtra();$("formTitle").textContent="새 묘소 기록";$("saveBtn").textContent="💾 묘소 기록 저장";$("cancelBtn").style.display="none";$("gpsStatus").textContent="위치 버튼을 누르면 GPS 좌표와 주소를 확인합니다."}
function gallery(r){const a=[];if(r.photos?.overall)a.push([r.photos.overall,"묘소 전체 앞면"]);if(r.photos?.front)a.push([r.photos.front,"묘비 앞면"]);if(r.photos?.back)a.push([r.photos.back,"묘비 뒷면"]);if(r.photos?.access)a.push([r.photos.access,"주변·진입로"]);(r.photos?.extra||[]).forEach((x,i)=>a.push([x,`추가 ${i+1}`]));return a.length?`<div class="gallery">${a.map(x=>`<figure><img src="${x[0]}"><figcaption>${x[1]}</figcaption></figure>`).join("")}</div>`:""}
function render(){const rs=getRecords();$("count").textContent=rs.length;if(!rs.length){$("records").innerHTML='<div class="empty">아직 저장된 기록이 없습니다.</div>';return}$("records").innerHTML=rs.map(r=>`<article class="record"><div class="record-title">${esc(r.name||"이름 없는 묘소")}</div>${r.relation?`<div class="meta">${esc(r.relation)}</div>`:""}${gallery(r)}<div class="meta">${r.address?"주소: "+esc(r.address)+"\n":""}${r.lat&&r.lng?"GPS: "+esc(r.lat)+", "+esc(r.lng)+"\n":""}${r.memo?"메모: "+esc(r.memo)+"\n":""}${r.surveyDate?"조사일자: "+esc(r.surveyDate)+"\n":""}저장: ${esc(r.savedAt||"")}</div><div class="actions" style="margin-top:9px">${r.lat&&r.lng?`<button class="secondary" onclick="openMap('${r.lat}','${r.lng}')">지도</button>`:""}<button class="secondary" onclick="editRecord('${r.id}')">수정</button><button class="danger" onclick="deleteRecord('${r.id}')">삭제</button></div></article>`).join("")}
window.openMap=(a,b)=>window.open(`https://www.google.com/maps?q=${encodeURIComponent(a)},${encodeURIComponent(b)}`,"_blank");$("mapBtn").onclick=()=>$("lat").value&&$("lng").value?openMap($("lat").value,$("lng").value):alert("먼저 GPS 위치를 가져오세요.");
$("gpsBtn").onclick=()=>{if(location.protocol!=="https:"&&location.hostname!=="localhost"){alert("GPS는 GitHub Pages 같은 https:// 주소에서 실행해야 합니다.");return}if(!navigator.geolocation){alert("GPS 기능을 지원하지 않습니다.");return}$("gpsBtn").disabled=true;$("gpsStatus").textContent="현재 위치 확인 중…";navigator.geolocation.getCurrentPosition(async p=>{const a=p.coords.latitude.toFixed(7),b=p.coords.longitude.toFixed(7);$("lat").value=a;$("lng").value=b;$("gpsStatus").textContent=`GPS 저장 준비 완료 (정확도 약 ${Math.round(p.coords.accuracy)}m)`;try{const res=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${a}&lon=${b}&accept-language=ko`);if(res.ok){const d=await res.json();if(d.display_name)$("address").value=d.display_name}}catch(e){}$("gpsBtn").disabled=false},e=>{$("gpsStatus").textContent="GPS를 확인하지 못했습니다. 위치 권한을 확인해 주세요.";$("gpsBtn").disabled=false},{enableHighAccuracy:true,timeout:30000,maximumAge:10000})};
$("saveBtn").onclick=()=>{const name=$("name").value.trim();if(!name){alert("성명 또는 묘소 이름을 입력해 주세요.");return}let rs=getRecords(),id=$("editId").value,old=rs.find(x=>x.id===id);const r={id:id||String(Date.now()),name,relation:$("relation").value.trim(),lat:$("lat").value.trim(),lng:$("lng").value.trim(),address:$("address").value.trim(),memo:$("memo").value.trim(),surveyDate:new Date().toLocaleDateString("ko-KR"),photos:{overall:photos.overall||(old?.photos?.overall||""),front:photos.front||(old?.photos?.front||""),back:photos.back||(old?.photos?.back||""),access:photos.access||(old?.photos?.access||""),extra:photos.extra.length?photos.extra:(old?.photos?.extra||[])},savedAt:new Date().toLocaleString("ko-KR")};if(id)rs=rs.map(x=>x.id===id?r:x);else rs.unshift(r);try{setRecords(rs);render();reset();alert("묘소 기록과 사진을 저장했습니다.")}catch(e){alert("저장 공간이 부족합니다. 전체 백업을 먼저 저장해 주세요.")}};
window.editRecord=id=>{const r=getRecords().find(x=>x.id===id);if(!r)return;$("editId").value=r.id;["name","relation","lat","lng","address","memo"].forEach(k=>$(k).value=r[k]||"");photos={overall:r.photos?.overall||"",front:r.photos?.front||"",back:r.photos?.back||"",access:r.photos?.access||"",extra:[...(r.photos?.extra||[])]};show("vOverall",photos.overall);show("vFront",photos.front);show("vBack",photos.back);show("vAccess",photos.access);showExtra();$("formTitle").textContent="묘소 기록 수정";$("saveBtn").textContent="💾 수정 내용 저장";$("cancelBtn").style.display="block";window.scrollTo({top:0,behavior:"smooth"})};window.deleteRecord=id=>{if(confirm("이 묘소 기록과 사진을 삭제할까요?")){setRecords(getRecords().filter(x=>x.id!==id));render()}};$("cancelBtn").onclick=reset;
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$("exportBtn").onclick=()=>dl(new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),records:getRecords()},null,2)],{type:"application/json"}),"묘소관리_Extension_백업_"+new Date().toISOString().slice(0,10)+".json");
$("csvBtn").onclick=()=>{const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"',rows=[["성명/묘소","관계/비고","주소","위도","경도","메모","묘소전체사진","묘비앞면","묘비뒷면","주변·진입로","추가사진수","조사일자","저장일"]];getRecords().forEach(r=>rows.push([r.name,r.relation,r.address,r.lat,r.lng,r.memo,r.photos?.overall?"있음":"",r.photos?.front?"있음":"",r.photos?.back?"있음":"",r.photos?.access?"있음":"",r.photos?.extra?.length||0,r.surveyDate||"",r.savedAt]));dl(new Blob(["\ufeff"+rows.map(x=>x.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),"묘소관리_목록_"+new Date().toISOString().slice(0,10)+".csv")};
$("importFile").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text()),a=Array.isArray(d)?d:d.records;if(!Array.isArray(a))throw 0;if(confirm(`백업의 ${a.length}개 기록으로 현재 기록을 교체할까요?`)){setRecords(a);render();reset();alert("백업을 불러왔습니다.")}}catch(err){alert("올바른 백업 파일이 아닙니다.")}e.target.value=""};render();
</script></body></html>
